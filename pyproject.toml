[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# ROS launch tests run through the separate integration scripts, not this suite.
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
