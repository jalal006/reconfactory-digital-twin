name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  watchdog-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install pure C++ test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libgtest-dev
      - name: Build and test watchdog policy without ROS or Gazebo
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iros2_ws/src/reconfactory_gazebo_watchdog/include \
            ros2_ws/src/reconfactory_gazebo_watchdog/test/policy_test.cc \
            -lgtest_main -lgtest -o /tmp/watchdog_policy_test
          /tmp/watchdog_policy_test
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        run: python -m pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run browser regression tests
        run: node tests/frontend_movement.test.js
