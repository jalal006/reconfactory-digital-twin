amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 300
    max_particles: 1000
    max_beams: 60
    laser_model_type: likelihood_field
    laser_max_range: 15.0
    update_min_d: 0.05
    update_min_a: 0.1
    transform_tolerance: 1.0
    tf_broadcast: true
    set_initial_pose: true
    # Initial pose is supplied from stations.yaml by the launch file.
map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.15
      allow_unknown: false
      max_planning_time: 2.0
      cost_travel_multiplier: 8.0
      # Logical loading needs no fixed docking heading: finish along the path.
      use_final_approach_orientation: true
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 25.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.12
      # Logical loading needs position and a stopped base, not a docking heading.
      yaw_goal_tolerance: 3.141592653589793
      stateful: false
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.1
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.45
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.7
      max_angular_accel: 1.0
      transform_tolerance: 0.3
      allow_reversing: false
      stateful: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.31
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 15.0
          obstacle_max_range: 10.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.31
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 15.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # Milliseconds, not seconds; tolerate WSL scheduling jitter during replans.
    default_server_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 0.9]
    min_velocity: [-0.15, 0.0, -0.9]
    max_accel: [0.7, 0.0, 1.0]
    max_decel: [-0.7, 0.0, -1.0]
    odom_topic: /odom
    velocity_timeout: 0.5
